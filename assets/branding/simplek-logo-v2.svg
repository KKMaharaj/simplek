<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#FFFFFF"/>

  <!-- Icon mark -->
  <g>
    <rect x="55" y="85" width="310" height="310" rx="72" fill="#12306B"/>

    <!-- Back invoice sheet, slightly rotated -->
    <g transform="rotate(-8 210 240)">
      <rect x="150" y="140" width="150" height="196" rx="10" fill="#3E7BE0"/>
    </g>

    <!-- Front invoice sheet -->
    <g>
      <rect x="140" y="130" width="150" height="210" rx="10" fill="#FFFFFF"/>
      <!-- perforated tear edge -->
      <line x1="140" y1="170" x2="290" y2="170" stroke="#DCE3EF" stroke-width="2" stroke-dasharray="3 6"/>
      <rect x="160" y="152" width="70" height="12" rx="6" fill="#12306B"/>
      <rect x="160" y="192" width="110" height="9" rx="4.5" fill="#B9C6DE"/>
      <rect x="160" y="216" width="110" height="9" rx="4.5" fill="#B9C6DE"/>
      <rect x="160" y="240" width="80" height="9" rx="4.5" fill="#B9C6DE"/>

      <!-- total row -->
      <line x1="160" y1="272" x2="270" y2="272" stroke="#DCE3EF" stroke-width="2"/>
      <rect x="160" y="288" width="55" height="14" rx="4" fill="#12306B"/>
      <text x="240" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12306B" text-anchor="end">₹</text>
    </g>

    <!-- coin / paid badge overlapping bottom-right -->
    <circle cx="300" cy="330" r="46" fill="#F5A623"/>
    <circle cx="300" cy="330" r="46" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M278 330 L294 346 L324 314" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="410" y="235" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="800" fill="#12306B" letter-spacing="-1">Simplek</text>
  <rect x="412" y="252" width="230" height="5" fill="#F5A623"/>
  <text x="412" y="295" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#5B6472">Invoicing made Easy</text>
</svg>
